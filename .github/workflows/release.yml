name: Build and deploy Comrade
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.12'
      - run: python3 tools/build-engine.py wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engines
          path: apps/web/public/engines
          if-no-files-found: error
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: python tools/build-engine.py native
      - uses: actions/upload-artifact@v4
        with:
          name: native-headless
          path: build/engine-native/Release/*.exe
          if-no-files-found: error
  image:
    needs: [wasm, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: wasm-engines
          path: apps/web/public/engines
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:unit && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser initialization for both engines
        run: |
          STATIC_ROOT=apps/web/dist node apps/service/dist/index.js > /tmp/comrade.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3001/health && break || sleep 1; done
          node tools/browser-smoke.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/flatt-t/projectcomrade:${{ github.sha }}
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.COMRADE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, comrade-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable image and verify health
        env:
          COMRADE_IMAGE: ghcr.io/flatt-t/projectcomrade@${{ needs.image.outputs.digest }}
        run: |
          docker compose -p comrade -f infra/containers/compose.yml pull
          docker compose -p comrade -f infra/containers/compose.yml up -d --wait --wait-timeout 90
          curl --fail --retry 5 --retry-delay 3 https://projectcomrade.thunderchildcreativetechnologies.com/health
